apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-frontend
  template:
    metadata:
      labels:
        app: app-frontend
    spec:
      containers:
      - name: frontend
        image: kdreer/incident-frontend:latest
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: frontend        
spec:
  type: ClusterIP          
  selector:
    app: app-frontend        
  ports:
    - port: 80        
      targetPort: 80