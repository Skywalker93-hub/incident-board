apiVersion: v1
kind: ServiceAccount
metadata:
  name: cd-account 
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cd-account
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cd-account
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cd-account
subjects:
- kind: ServiceAccount
  name: cd-account
---
apiVersion: v1
kind: Secret
metadata:
  name: cd-account-token
  annotations:
    kubernetes.io/service-account.name: cd-account
type: kubernetes.io/service-account-token