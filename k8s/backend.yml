apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-backend
  template:
    metadata:
      labels:
        app: app-backend
    spec:
      containers:
      - name: backend
        image: kdreer/incident-backend:latest
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_NAME
        - name: DB_PORT
          value: "5432"
        - name: DB_HOST
          value: "db"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: backend        
spec:
  type: ClusterIP          
  selector:
    app: app-backend        
  ports:
    - port: 5001        
      targetPort: 5001
       