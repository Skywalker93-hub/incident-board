services:
  frontend:
    image: incident-frontend:latest
    container_name: incident-frontend
    ports:
      - 8080:80
    volumes:
      - /Users/kristinadreer/GitHub/incident-board/frontend/index.html:/usr/share/nginx/html/index.html
      - /Users/kristinadreer/GitHub/incident-board/frontend/mysite.conf:/etc/nginx/conf.d/mysite.conf:ro
      - /Users/kristinadreer/GitHub/incident-board/frontend/nginx.conf:/etc/nginx/nginx.conf:ro
  backend:
    image: incident-backend:latest
    container_name: incident-backend
    ports:
      - 5001:5001
  db:
    image: postgres:18
    container_name: db
    environment:
       POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
