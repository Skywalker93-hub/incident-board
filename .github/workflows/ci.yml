name: Incident Board CI

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build_frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Verify Docker runtime
        run: docker info

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5.3.0
        with:
          context: ./docker/frontend
          file: ./docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/incident-frontend:latest
            ${{ secrets.DOCKER_USER }}/incident-frontend:${{ github.sha }}

  build_backend:
    runs-on: ubuntu-latest  

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Verify Docker runtime
        run: docker info

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5.3.0
        with:
          context: ./docker/backend
          file: ./docker/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/incident-backend:latest
            ${{ secrets.DOCKER_USER }}/incident-backend:${{ github.sha }}
      
  deploy:
    runs-on: ubuntu-latest
    needs: [build_frontend, build_backend]

    steps:
      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Deploy new images
        run: |
          kubectl set image deployment/app-backend backend=${{ secrets.DOCKER_USER }}/incident-backend:${{ github.sha }}
          kubectl set image deployment/app-frontend frontend=${{ secrets.DOCKER_USER }}/incident-frontend:${{ github.sha }}

      - name: Verify rollout status
        run: |
          kubectl rollout status deployment/app-backend
          kubectl rollout status deployment/app-frontend