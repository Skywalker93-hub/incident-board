name: Incident Board CI

on:
  push:
    branches:
      - master
      - feature/incident-management
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build

      - name: Start services
        run: docker compose up -d --no-build

      - name: Wait for API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 3 http://localhost:8080/api/incidents; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become available"
          exit 1

      - name: Test incident API
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import Request, urlopen

          base_url = "http://localhost:8080/api/incidents"

          def call(method, url, data=None):
              body = json.dumps(data).encode() if data is not None else None
              request = Request(
                  url,
                  data=body,
                  headers={"Content-Type": "application/json"},
                  method=method,
              )
              with urlopen(request, timeout=10) as response:
                  return response.status, json.load(response)

          status, created = call("POST", base_url, {"title": "CI test incident"})
          assert status == 201
          assert created["title"] == "CI test incident"
          assert created["resolved"] is False

          incident_id = created["id"]

          _, incidents = call("GET", base_url)
          assert created in incidents

          status, resolved = call("PATCH", f"{base_url}/{incident_id}")
          assert status == 200
          assert resolved["id"] == incident_id
          assert resolved["resolved"] is True

          _, incidents = call("GET", base_url)
          assert resolved in incidents

          print("Incident creation, retrieval and resolution passed")
          PY

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Clean up
        if: always()
        run: docker compose down -v
